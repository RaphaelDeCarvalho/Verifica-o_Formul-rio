<!DOCTYPE html>
<html>
<head>
<style>
	body {
    height: 100vh;
    width: 100vw;
    display: flex;
    justify-content: center;
    flex-direction: column;
    align-items: center;
}
h2 {
    font-size: 100px;
}
div#acess_links {
    display: flex;
    flex-direction: column;
}
a {
    display: flex;
    font-size: 50px;
    justify-content: space-around;
    padding: 7rem;
}
</style>
</head>
<body onload = myFunction()>

<h2>ACESSO</h2>
<p id="update_text" style="display: none;">Recarregue a página!</p>
<div id="acess_links" style="display: none;">
<a href="https://docs.google.com/forms/d/e/1FAIpQLSfh8ZRoUY_sztdLLhd5S47RngwqZPVMQyPLxVwsnw-gxKPSPA/viewform?usp=header" style="border-bottom: 200px;">PERÍODO MANHÃ</a><br>
  <a id="acess_links" href="https://docs.google.com/forms/d/e/1FAIpQLSeCy8MORFxJS9MGpuIjNEoCmVJz8c_JoGaxtW73F0_GouwGrg/viewform?usp=header" style="border-bottom: 200px;">PERÍODO TARDE</a><br>
<a id="acess_links" href="https://docs.google.com/forms/d/e/1FAIpQLScWmiZMQQWSgY3U9owpQmoQt2ZwcPOq9VxA3Ot0K9ZlkJVAEg/viewform?usp=header" style="border-bottom: 200px;">PERÍODO NOTURNO</a><br>
</div>
<script>
function myFunction() {
const SENHA_CORRETA = "1234";
const texto = document.getElementById("update_text");
const acesso = document.getElementById("acess_links")
let senhaDigitada;

do {
  senhaDigitada = prompt("Digite a sua senha:");

  // Se o usuário clicar em "Cancelar" no prompt
  if (senhaDigitada === null) {
    texto.style.display = "block";
    alert("Operação cancelada.");
    break;

  }

  if (senhaDigitada !== SENHA_CORRETA) {
    alert("Senha incorreta! Tente novamente.");
  }

} while (senhaDigitada !== SENHA_CORRETA);

// Só executa quando a senha estiver correta
if (senhaDigitada === SENHA_CORRETA) {
	acesso.style.display = "block";
  	alert("Acesso permitido! Bem-vindo.");
    
}
}
</script>

</body>
</html>
